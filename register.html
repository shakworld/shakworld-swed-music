<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join SWED — Artist Registration</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="assets/css/style.css" rel="stylesheet"></head>
<body class="auth-page"><nav class="navbar navbar-dark swed-nav"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2" href="index.html"><img src="assets/images/icons/icon.png" class="brand-icon" alt="" onerror="this.style.display='none'"><span class="brand-word">SWED<span class="brand-dot">.</span></span></a><a class="nav-link" href="index.html"><i class="bi bi-arrow-left me-2"></i>Back to home</a></div></nav>
<main class="auth-wrap"><div class="auth-card auth-card-wide"><div class="auth-emblem"><i class="bi bi-music-note-beamed"></i></div><div class="eyebrow justify-content-center">YOUR NEXT CHAPTER</div><h1>Join the movement.</h1><p class="text-secondary">Create your SWED artist account.</p><div class="alert alert-warning small">Registration uses Supabase Auth. You may need to confirm your email before logging in.</div><form id="registerForm"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="artistName">Artist / stage name</label><input class="form-control swed-input" id="artistName" required placeholder="Your artist name"></div><div class="col-md-6"><label class="form-label" for="country">Country</label><select class="form-select swed-input" id="country" required><option value="">Select country</option><option>Nigeria</option><option>Ghana</option><option>Kenya</option><option>South Africa</option><option>Uganda</option><option>Tanzania</option><option>Rwanda</option><option>Senegal</option><option>Cameroon</option><option>Other</option></select></div><div class="col-12"><label class="form-label" for="email">Email address</label><input class="form-control swed-input" type="email" id="email" required placeholder="you@example.com"></div><div class="col-12"><label class="form-label" for="password">Create password</label><input class="form-control swed-input" type="password" id="password" minlength="8" required placeholder="At least 8 characters"></div><div class="col-12 form-check ms-2 mt-3"><input class="form-check-input" type="checkbox" id="agree" required><label class="form-check-label small" for="agree">I understand this is a preview and agree to review the <a href="agreements/artist-distribution-agreement.md" target="_blank">artist agreement draft</a> before using SWED.</label></div><div class="col-12"><button class="btn btn-gold w-100" type="submit">Create account <i class="bi bi-arrow-right ms-2"></i></button><p id="formMessage" class="small mt-3 mb-0" role="status"></p></div></div></form><p class="auth-switch">Already registered? <a href="login.html">Log in</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth-demo.js"></script></body></html>
